{% extends "base.html" %}

{% block content %}

<h1 class="mb-4">
    🏆 Circuiti
</h1>

<div class="mb-3">

    <a
        href="/circuiti/nuovo"
        class="btn btn-primary"
    >
        🆕 Nuovo circuito
    </a>

</div>

{% if circuiti %}

    {% for circuito in circuiti %}

        <div class="card shadow mb-3">

            <div class="card-body">

                <h5>
                    🏆 {{ circuito["nome"] }}
                </h5>

                <div class="mt-3">

                    <a
                        href="/circuiti/modifica/{{ circuito['id'] }}"
                        class="btn btn-warning btn-sm"
                    >
                        ✏️ Modifica
                    </a>

                    <a
                        href="/circuiti/elimina/{{ circuito['id'] }}"
                        class="btn btn-danger btn-sm"
                        onclick="return confirm('Eliminare il circuito?')"
                    >
                        🗑 Elimina
                    </a>

                    <a
                        href="/circuiti/allegati/{{ circuito['id'] }}"
                        class="btn btn-info"
                    >
                        📎 Allegati
                    </a>

                </div>

            </div>

        </div>

    {% endfor %}

{% else %}

    <div class="alert alert-info">
        Nessun circuito presente.
    </div>

{% endif %}

{% endblock %}
