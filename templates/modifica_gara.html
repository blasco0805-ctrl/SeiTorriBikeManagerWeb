{% extends "base.html" %}

{% block content %}

<h1 class="mb-4">
    ✏️ Modifica Gara
</h1>

<form
    method="POST"
    action="/gare/aggiorna/{{ gara['id'] }}"
>

    <div class="mb-3">

        <label class="form-label">
         <input
            type="text"
            name="nome"
            class="form-control"
            value="{{ gara['nome'] }}"
            required
        >

    </div>

    <div class="mb-3">

        <label class="form-label">
            Luogo
        </label>

        <input
            type="text"
            name="luogo"
            class="form-control"
            value="{{ gara['luogo'] }}"
        >

    </div>

    <div class="mb-3">

        <label class="form-label">
            Data
        </label>

        <input
            type="date"
            name="data"
            class="form-control"
            value="{{ gara['data'] }}"
            required
        >

    </div>

    <div class="mb-3">

        <label class="form-label">
            Tipologia
        </label>

        <input
            type="text"
            name="tipologia"
            class="form-control"
            value="{{ gara['tipologia'] }}"
        >

    </div>

    <div class="mb-3">

        <label class="form-label">
            Circuito
        </label>

        <select name="circuito_id" class="form-control">
            {% for circuito in circuiti %}
            <option value="{{ circuito.id }}"
                {% if circuito.id == gara.circuito_id %}selected{% endif %}>
                {{ circuito.nome }}
            </option>
            {% endfor %}
        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Distanza (km)
        </label>

        <input
            type="number"
            step="0.1"
            name="distanza"
            class="form-control"
            value="{{ gara['distanza'] }}"
        >

    </div>

    <div class="mb-3">

        <label class="form-label">
            Dislivello (m)
        </label>

        <input
            type="number"
            name="dislivello"
            class="form-control"
            value="{{ gara['dislivello'] }}"
        >

    </div>

    <div class="mb-3">

        <label class="form-label">
            Descrizione
        </label>

        <textarea
            name="descrizione"
            class="form-control"
            rows="4"
        >{{ gara['descrizione'] }}</textarea>

    </div>

        <button
        type="submit"
        class="btn btn-success"
    >
        💾 Salva Modifiche
    </button>

    <a
        href="/gare"
        class="btn btn-secondary"
    >
        ↩️ Annulla
    </a>

</form>

{% endblock %}
`
